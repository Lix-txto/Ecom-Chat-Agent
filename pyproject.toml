[project]
name = "Ecom-Chat-Agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "bcrypt==4.0.1",
    "celery[redis]>=5.4",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "gradio>=6.0,<7",
    "greenlet>=3.5.6",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-redis>=0.3",
    "openai>=3.37.0",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "pypdf>=5.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.9",
    "redis>=5.2",
    "requests>=2.34.2",
    "sqlmodel>=0.0.22",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
pythonpath = ["."]   # ← 必须补这行
